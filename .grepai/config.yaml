version: 1
embedder:
    provider: ollama
    model: nomic-embed-text
    endpoint: http://localhost:11434
    dimensions: 768
    parallelism: 4
store:
    backend: gob
chunking:
    size: 512
    overlap: 50
framework_processing:
    enabled: true
    mode: auto
    node_path: node
    frameworks:
        vue:
            enabled: true
        svelte:
            enabled: false
        astro:
            enabled: false
        solid:
            enabled: false
watch:
    debounce_ms: 500
    last_index_time: 2026-10-22T20:18:17.347574+02:00
    rpg_persist_interval_ms: 1000
    rpg_derived_debounce_ms: 300
    rpg_full_reconcile_interval_sec: 300
    rpg_max_dirty_files_per_batch: 128
    discover_worktrees: false
search:
    boost:
        enabled: false
        penalties:
            - pattern: /mock/
              factor: 0.6
            - pattern: /docs/
              factor: 0.7
        bonuses:
            - pattern: /include/graphic/
              factor: 1.15
    hybrid:
        enabled: true
        k: 60
    dedup:
        enabled: true
trace:
    mode: fast
    enabled_languages:
        - .cpp
        - .hpp
        - .c
        - .h
        - .cc
        - .cxx
    exclude_patterns: []
rpg:
    enabled: true
    feature_mode: hybrid
    drift_threshold: 0.35
    max_traversal_depth: 3
    llm_provider: openai
    llm_model: openai/gpt-6-luna#xhigh
    llm_endpoint: http://127.0.0.1:48765/artist/v1
    llm_api_key: ${GREPAI_RPG_BRIDGE_TOKEN}
    llm_timeout_ms: 125000
    feature_group_strategy: sample
update:
    check_on_startup: false
ignore:
    - .git
    - .grepai
    - .serena
    - .opencode
    - out
    - build
    - _deps
    - node_modules
    - test-datas
    - html
    - graph_info.json
    - compile_commands.json

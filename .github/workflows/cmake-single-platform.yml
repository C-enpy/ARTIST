name: Linux Debug parity

on:
  push:
    branches: [main, 'mission/linux-qa-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [normal, asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 libstdc++-14-dev cmake pkg-config python3-venv xvfb xauth mesa-utils libgl1-mesa-dri libgl1-mesa-dev libglu1-mesa-dev libx11-xcb-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          # xorg/system recipe requirements, in check mode in the shared profile.
          sudo apt-get install -y libfontenc-dev libice-dev libsm-dev libxau-dev libxaw7-dev libxcomposite-dev libxdamage-dev libxdmcp-dev libxext-dev libxfixes-dev libxkbfile-dev libxmu-dev libxmuu-dev libxpm-dev libxrender-dev libxres-dev libxss-dev libxt-dev libxtst-dev libxv-dev libxxf86vm-dev libxcb-glx0-dev libxcb-render0-dev libxcb-render-util0-dev libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-dri3-dev uuid-dev libxcb-cursor-dev libxcb-dri2-0-dev libxcb-present-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev libxcb-util-dev
          python3 -m venv out/tooling/build
          out/tooling/build/bin/pip install -r scripts/build-requirements.txt
          echo "$GITHUB_WORKSPACE/out/tooling/build/bin" >> "$GITHUB_PATH"
      - name: Adapter contract checks
        run: python3 -B scripts/tests/test_linux_evidence.py -v
      - name: Build and validate the required population
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
        run: |
          args=()
          if [[ '${{ matrix.sanitizer }}' == asan ]]; then args+=(--address-sanitizer); fi
          xvfb-run -a python3 -B scripts/linux-evidence.py "${args[@]}"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.sanitizer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/linux-evidence/
            out/build/linux-debug*/CMakeFiles/CMakeConfigureLog.yaml
            out/build/linux-debug*/compile_commands.json
          if-no-files-found: warn
